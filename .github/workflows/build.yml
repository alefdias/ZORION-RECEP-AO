name: 'Zorion Recepção - Release & Build EXE'

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publicar / Atualizar Release no GitHub?'
        required: true
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-windows:
    name: 'Compilar Windows (.exe)'
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: Install Frontend Dependencies
        run: npm install

      - name: Read Version
        id: app_info
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          else
            TAG_NAME="v$VERSION"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "Compilando versao: $VERSION (Tag: $TAG_NAME)"

      - name: Build Tauri App (.exe and installers)
        run: npm run tauri:build

      - name: Organizar Arquivos Gerados
        shell: bash
        run: |
          mkdir -p release-artifacts
          VERSION="${{ steps.app_info.outputs.VERSION }}"

          echo "=== 1. Instalador NSIS ==="
          if [ -d "src-tauri/target/release/bundle/nsis" ]; then
            for f in src-tauri/target/release/bundle/nsis/*.exe; do
              if [ -f "$f" ]; then
                echo "Copiando NSIS: $f"
                cp "$f" release-artifacts/
              fi
            done
          fi

          echo "=== 2. Instalador MSI ==="
          if [ -d "src-tauri/target/release/bundle/msi" ]; then
            for f in src-tauri/target/release/bundle/msi/*.msi; do
              if [ -f "$f" ]; then
                echo "Copiando MSI: $f"
                cp "$f" release-artifacts/
              fi
            done
          fi

          echo "=== 3. Executável Portátil Standalone ==="
          if [ -f "src-tauri/target/release/zorion-recepcao.exe" ]; then
            cp "src-tauri/target/release/zorion-recepcao.exe" "release-artifacts/Zorion-Recepcao-v${VERSION}-Portatil.exe"
          fi

          echo "=== 4. Checksums SHA256 ==="
          cd release-artifacts
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum *.* > SHA256SUMS.txt || true
          fi
          cd ..

          echo "=== Lista final de release-artifacts: ==="
          ls -la release-artifacts/

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ steps.app_info.outputs.TAG_NAME }}
          name: 'Zorion Recepção ${{ steps.app_info.outputs.TAG_NAME }}'
          body: |
            ## Zorion Recepção ${{ steps.app_info.outputs.TAG_NAME }} 🚀
            
            Sistema de Recepção, Admissão de Pacientes e Controle de Leitos.
            
            ### 📦 Arquivos para download:
            - **Instalador Completo (.exe)**: Assistente de instalação no Windows com atalhos.
            - **Versão Portátil Standalone (.exe)**: Pronto para executar direto no Windows sem instalação.
            - **Instalador MSI (.msi)**: Pacote corporativo Windows.
            - **SHA256SUMS.txt**: Hashes de verificação.
          files: release-artifacts/*
          fail_on_unmatched_files: false
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows Artifacts (Fallback)
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: zorion-recepcao-v${{ steps.app_info.outputs.VERSION }}-windows
          path: release-artifacts/*
          if-no-files-found: warn
          retention-days: 7
